name: pylo

services:
  backend:
    build: ./backend
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./pybooks_storage:/app/pybooks_storage
      - ./objects_storage:/app/objects_storage
      - ./pylo_sdk.py:/app/pylo_sdk.py:ro
      - ./tests:/app/tests:ro
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini
    ports:
      - "8000:8000"
    env_file: .env
    restart: unless-stopped
    networks:
      - pylo_default
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pylo_default

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pylo}
      POSTGRES_USER: ${POSTGRES_USER:-pylo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pylo_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - pylo_default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-pylo} -d $${POSTGRES_DB:-pylo}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  pylo_default:
    driver: bridge

volumes:
  postgres_data:
