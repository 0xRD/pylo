name: pylo

services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Allow only the endpoints the backend actually needs
      CONTAINERS: 1
      IMAGES: 1
      BUILD: 1
      POST: 1
      DELETE: 1
      INFO: 1
      VERSION: 1
      PING: 1
      # Deny everything else
      NETWORKS: 0
      VOLUMES: 0
      EXEC: 0
      SWARM: 0
      SERVICES: 0
      TASKS: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      CONFIGS: 0
      COMMIT: 0
      SYSTEM: 0
      DISTRIBUTION: 0
      AUTH: 0
      EVENTS: 0
    restart: unless-stopped
    networks:
      - socket_proxy

  backend:
    build: ./backend
    volumes:
      - ./pybooks_storage:/app/pybooks_storage
      - ./pylo_sdk.py:/app/pylo_sdk.py:ro
      - ./tests:/app/tests:ro
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pylo}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-pylo}
      DOCKER_HOST: tcp://socket-proxy:2375
    depends_on:
      postgres:
        condition: service_healthy
      socket-proxy:
        condition: service_started
    restart: unless-stopped
    networks:
      - pylo_default
      - socket_proxy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pylo_default

  postgres:
    image: postgres:16.14-alpine3.23@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pylo}
      POSTGRES_USER: ${POSTGRES_USER:-pylo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - pylo_default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-pylo} -d $${POSTGRES_DB:-pylo}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  pylo_default:
    driver: bridge
  socket_proxy:
    driver: bridge
    internal: true

volumes:
  postgres_data:
