name: pylo

services:
  backend:
    build: ./backend
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./pybooks_storage:/app/pybooks_storage
      - ./objects_storage:/app/objects_storage
      - ./pylo_sdk.py:/app/pylo_sdk.py:ro
      - ./tests:/app/tests:ro
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini
      - ./:/app/repo
    ports:
      - "8000:8000"
    env_file: .env
    restart: unless-stopped
    networks:
      - pylo_default
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_TOKEN: ${API_TOKEN:-change_me_in_production}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pylo_default

networks:
  pylo_default:
    driver: bridge
