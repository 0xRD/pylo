map $http_upgrade $proxy_upgrade {
    ~*^websocket$ $http_upgrade;
    default "";
}

map $http_upgrade $connection_upgrade {
    ~*^websocket$ "upgrade";
    default "";
}

server {
    listen 3000;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_url http://backend:8000;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:; img-src 'self' data:; worker-src 'self' blob:; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    root /usr/share/nginx/html;

    # Vite emits content-hashed file names, so assets can be cached forever.
    # `expires` (unlike add_header) keeps the server-level security headers.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # The SPA shell must always be revalidated so new deployments load.
    location = /index.html {
        expires -1;
    }

    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass $backend_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # Full backup restores and blueprint imports are uploaded as files.
        client_max_body_size 200m;
        proxy_set_header Upgrade $proxy_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }

    location /health {
        proxy_pass $backend_url;
    }
}
